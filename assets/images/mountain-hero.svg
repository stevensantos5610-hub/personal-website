<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1F44" />
      <stop offset="45%" stop-color="#123B7A" />
      <stop offset="78%" stop-color="#2F5FA8" />
      <stop offset="100%" stop-color="#7FA8D9" />
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A6BB0" />
      <stop offset="100%" stop-color="#2C56A0" />
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4488" />
      <stop offset="100%" stop-color="#173972" />
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2C61" />
      <stop offset="100%" stop-color="#0A2050" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)" />

  <!-- soft stars -->
  <g fill="#EAF1FF" opacity="0.55">
    <circle cx="120" cy="90" r="1.6" /><circle cx="260" cy="150" r="1.2" /><circle cx="410" cy="70" r="1.8" />
    <circle cx="560" cy="130" r="1.2" /><circle cx="720" cy="60" r="1.6" /><circle cx="880" cy="140" r="1.3" />
    <circle cx="1030" cy="80" r="1.7" /><circle cx="1190" cy="120" r="1.2" /><circle cx="1340" cy="70" r="1.6" />
    <circle cx="1480" cy="150" r="1.3" /><circle cx="190" cy="220" r="1.1" /><circle cx="960" cy="200" r="1.1" />
  </g>

  <!-- far volcanic ridge -->
  <path d="M0,560 L120,520 220,545 340,470 420,505 520,430 620,470 720,410 830,460 930,420 1040,470 1140,430 1250,480 1360,440 1460,485 1600,455 1600,900 0,900 Z" fill="url(#ridgeFar)" opacity="0.85" />

  <!-- mid ridge with a volcano peak -->
  <path d="M0,660 L100,630 200,645 300,560 360,610 460,480 560,600 660,620 760,570 880,630 980,600 1100,650 1220,610 1340,655 1460,620 1600,650 1600,900 0,900 Z" fill="url(#ridgeMid)" />

  <!-- near tree/ridge line -->
  <path d="M0,760 L90,730 170,755 260,700 340,740 420,690 520,745 610,715 700,760 800,720 900,755 1000,700 1100,745 1200,710 1320,755 1420,720 1600,745 1600,900 0,900 Z" fill="url(#ridgeNear)" />

  <!-- torogoz silhouette in flight -->
  <g transform="translate(1180,260) scale(1.1)" fill="#EAF1FF" opacity="0.8">
    <path d="M0,10 C10,0 26,-2 34,4 C28,6 22,8 18,12 C26,14 34,20 36,28 C28,24 20,22 14,22 C16,30 14,40 8,46 C8,36 6,28 2,22 C-4,26 -10,32 -12,40 C-10,30 -8,22 -2,16 C-8,14 -14,16 -18,20 C-14,12 -6,8 0,10 Z" />
  </g>
</svg>
